<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>موجة | اختصار الروابط</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --deep:#04141c;
    --deep2:#072530;
    --teal:#0d3b45;
    --foam:#eafdfb;
    --cyan:#39e5d1;
    --cyan-dim:#1f9c92;
    --coral:#ff7a59;
    --glass: rgba(234,253,251,0.06);
    --glass-border: rgba(234,253,251,0.16);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100svh;
    background: radial-gradient(120% 120% at 50% 0%, var(--teal) 0%, var(--deep2) 45%, var(--deep) 100%);
    font-family:'Tajawal', sans-serif;
    color:var(--foam);
    overflow-x:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    position:relative;
  }

  /* ---------- Liquid background blobs ---------- */
  .blobs{position:fixed; inset:0; z-index:0; overflow:hidden; filter:blur(40px);}
  .blob{position:absolute; border-radius:50%; opacity:0.35; mix-blend-mode:screen;}
  .blob1{width:60vmax;height:60vmax; background:radial-gradient(circle at 30% 30%, var(--cyan), transparent 70%); top:-20vmax; left:-15vmax; animation:drift1 22s ease-in-out infinite;}
  .blob2{width:50vmax;height:50vmax; background:radial-gradient(circle at 60% 40%, var(--cyan-dim), transparent 70%); bottom:-20vmax; right:-15vmax; animation:drift2 26s ease-in-out infinite;}
  .blob3{width:35vmax;height:35vmax; background:radial-gradient(circle at 50% 50%, var(--coral), transparent 70%); top:40%; left:60%; opacity:0.18; animation:drift3 30s ease-in-out infinite;}
  @keyframes drift1{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(8vmax,10vmax) scale(1.15);}
  }
  @keyframes drift2{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(-10vmax,-6vmax) scale(1.1);}
  }
  @keyframes drift3{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(-6vmax,8vmax) scale(1.25);}
  }

  /* subtle ripple grid overlay for a "water surface" feel */
  .ripple-overlay{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background-image: repeating-radial-gradient(circle at 50% 50%, rgba(234,253,251,0.025) 0, rgba(234,253,251,0.025) 1px, transparent 2px, transparent 40px);
    animation: rippleMove 12s linear infinite;
    opacity:0.5;
  }
  @keyframes rippleMove{
    0%{background-position:0 0;}
    100%{background-position:0 160px;}
  }

  /* ---------- Layout ---------- */
  .wrap{position:relative; z-index:2; width:100%; max-width:480px;}

  .brand{text-align:center; margin-bottom:28px;}
  .brand .logo{
    font-family:'Space Grotesk', sans-serif;
    font-size:15px; letter-spacing:4px; color:var(--cyan);
    text-transform:uppercase; opacity:0.85;
  }
  .brand h1{
    font-size:clamp(28px,7vw,40px);
    margin:6px 0 0;
    font-weight:900;
    background:linear-gradient(90deg, var(--foam), var(--cyan) 60%, var(--foam));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .brand p{margin:8px 0 0; color:rgba(234,253,251,0.6); font-size:14px;}

  /* ---------- 3D flip card ---------- */
  .stage{perspective:1400px;}
  .card3d{
    position:relative;
    width:100%;
    min-height:280px;
    transform-style:preserve-3d;
    transition:transform 0.9s cubic-bezier(.2,.9,.2,1.05);
  }
  .card3d.flipped{transform:rotateY(180deg);}

  .face{
    position:absolute; inset:0;
    backface-visibility:hidden;
    border-radius:24px;
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:0 20px 60px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.08);
    padding:28px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:16px;
  }
  .face-back{transform:rotateY(180deg);}

  label{font-size:13px; color:rgba(234,253,251,0.65);}
  .url-input{
    width:100%;
    padding:16px 18px;
    border-radius:16px;
    border:1px solid var(--glass-border);
    background:rgba(4,20,28,0.4);
    color:var(--foam);
    font-size:16px;
    font-family:inherit;
    outline:none;
    transition:border-color .25s, box-shadow .25s;
  }
  .url-input:focus{border-color:var(--cyan); box-shadow:0 0 0 4px rgba(57,229,209,0.15);}
  .url-input::placeholder{color:rgba(234,253,251,0.35);}

  .btn{
    border:none; cursor:pointer;
    padding:16px 20px;
    border-radius:16px;
    font-family:inherit;
    font-size:16px; font-weight:700;
    background:linear-gradient(135deg, var(--cyan), var(--cyan-dim));
    color:#03181c;
    position:relative; overflow:hidden;
    transition:transform .2s, box-shadow .2s;
  }
  .btn:active{transform:scale(0.97);}
  .btn:disabled{opacity:0.6; cursor:default;}
  .btn .shine{
    position:absolute; top:0; left:-60%; width:40%; height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,0.6), transparent);
    transform:skewX(-20deg);
    animation:shine 3.5s ease-in-out infinite;
  }
  @keyframes shine{
    0%{left:-60%;} 40%{left:130%;} 100%{left:130%;}
  }

  .btn-ghost{
    background:transparent;
    border:1px solid var(--glass-border);
    color:var(--foam);
  }

  .error-msg{color:var(--coral); font-size:13px; min-height:16px;}

  .result-url{
    display:flex; align-items:center; gap:8px;
    background:rgba(4,20,28,0.5);
    border:1px solid var(--glass-border);
    border-radius:16px;
    padding:14px 16px;
    font-family:'Space Grotesk', monospace;
    font-size:15px;
    color:var(--cyan);
    word-break:break-all;
    direction:ltr;
    text-align:left;
  }
  .success-badge{
    font-size:13px; color:rgba(234,253,251,0.6);
  }

  /* ---------- redirect / loading state ---------- */
  .redirect-screen{
    position:fixed; inset:0; z-index:10;
    background:var(--deep);
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:18px;
    text-align:center;
  }
  .drop{
    width:54px; height:54px;
    border-radius:50% 50% 50% 0;
    background:linear-gradient(135deg, var(--cyan), var(--cyan-dim));
    transform:rotate(45deg);
    animation:dropPulse 1.1s ease-in-out infinite;
  }
  @keyframes dropPulse{
    0%,100%{transform:rotate(45deg) scale(1);}
    50%{transform:rotate(45deg) scale(1.25);}
  }
  .hidden{display:none !important;}

  footer{text-align:center; margin-top:24px; font-size:12px; color:rgba(234,253,251,0.35);}
</style>
</head>
<body>

<div class="blobs">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
</div>
<div class="ripple-overlay"></div>

<!-- Redirect loading screen (shown only when visiting a short link) -->
<div id="redirectScreen" class="redirect-screen hidden">
  <div class="drop"></div>
  <div id="redirectText">بنوصلك للرابط...</div>
</div>

<div class="wrap" id="mainApp">
  <div class="brand">
    <div class="logo">WAVE LINKS</div>
    <h1>موجة</h1>
    <p>اختصر رابطك في ثانية</p>
  </div>

  <div class="stage">
    <div class="card3d" id="card3d">

      <!-- FRONT: input form -->
      <div class="face face-front">
        <label for="longUrl">الرابط الطويل</label>
        <input type="text" id="longUrl" class="url-input" placeholder="https://example.com/very/long/link" />
        <div class="error-msg" id="errorMsg"></div>
        <button class="btn" id="shortenBtn">
          <span class="shine"></span>
          اختصر الرابط
        </button>
      </div>

      <!-- BACK: result -->
      <div class="face face-back">
        <label>رابطك الجديد جاهز</label>
        <div class="result-url" id="resultUrl">—</div>
        <div class="success-badge" id="copiedMsg">دوس عليه للنسخ</div>
        <button class="btn btn-ghost" id="againBtn">اختصار رابط تاني</button>
      </div>

    </div>
  </div>

  <footer>مبني بحب على Supabase</footer>
</div>

<script>
  // ====== Supabase config ======
  const SUPABASE_URL = "https://ohnyndnscrktcidfnvvo.supabase.co";
  const SUPABASE_KEY = "sb_publishable_5hDMPysgOtpWq-6SVT1fLQ_28zCTo6j";
  const TABLE = "Links";

  const REST = `${SUPABASE_URL}/rest/v1/${TABLE}`;
  const headers = {
    "apikey": SUPABASE_KEY,
    "Authorization": `Bearer ${SUPABASE_KEY}`,
    "Content-Type": "application/json"
  };

  function randomCode(len = 6) {
    const chars = "abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let out = "";
    for (let i = 0; i < len; i++) out += chars[Math.floor(Math.random() * chars.length)];
    return out;
  }

  function normalizeUrl(v) {
    v = v.trim();
    if (!v) return null;
    if (!/^https?:\/\//i.test(v)) v = "https://" + v;
    try { new URL(v); return v; } catch (e) { return null; }
  }

  async function createShortLink(originalUrl) {
    for (let attempt = 0; attempt < 5; attempt++) {
      const code = randomCode(6);
      const res = await fetch(REST, {
        method: "POST",
        headers: { ...headers, "Prefer": "return=representation" },
        body: JSON.stringify({ short_code: code, original_url: originalUrl, clicks: 0 })
      });
      if (res.ok) {
        return code;
      }
      // 409 = duplicate short_code, try again with a new random code
      if (res.status !== 409) {
        const text = await res.text();
        throw new Error(text || "تعذر إنشاء الرابط");
      }
    }
    throw new Error("تعذر إنشاء رابط فريد، حاول تاني");
  }

  async function lookupShortLink(code) {
    const res = await fetch(`${REST}?short_code=eq.${encodeURIComponent(code)}&select=original_url,clicks,id`, {
      headers
    });
    if (!res.ok) return null;
    const rows = await res.json();
    return rows.length ? rows[0] : null;
  }

  function bumpClicks(id, current) {
    fetch(`${REST}?id=eq.${id}`, {
      method: "PATCH",
      headers,
      body: JSON.stringify({ clicks: (current || 0) + 1 })
    }).catch(() => {});
  }

  // ====== UI wiring ======
  const card3d = document.getElementById("card3d");
  const longUrlInput = document.getElementById("longUrl");
  const shortenBtn = document.getElementById("shortenBtn");
  const errorMsg = document.getElementById("errorMsg");
  const resultUrl = document.getElementById("resultUrl");
  const againBtn = document.getElementById("againBtn");

  shortenBtn.addEventListener("click", async () => {
    errorMsg.textContent = "";
    const normalized = normalizeUrl(longUrlInput.value);
    if (!normalized) {
      errorMsg.textContent = "اكتب رابط صحيح من فضلك";
      return;
    }
    shortenBtn.disabled = true;
    shortenBtn.textContent = "بنختصر...";
    try {
      const code = await createShortLink(normalized);
      const fullShort = `${location.origin}/${code}`;
      resultUrl.textContent = fullShort;
      resultUrl.dataset.link = fullShort;
      card3d.classList.add("flipped");
    } catch (e) {
      errorMsg.textContent = "حصل خطأ، جرب تاني";
      console.error(e);
    } finally {
      shortenBtn.disabled = false;
      shortenBtn.innerHTML = '<span class="shine"></span>اختصر الرابط';
    }
  });

  resultUrl.addEventListener("click", () => {
    const link = resultUrl.dataset.link;
    if (!link) return;
    navigator.clipboard?.writeText(link);
    document.getElementById("copiedMsg").textContent = "اتنسخ! ✅";
    setTimeout(() => {
      document.getElementById("copiedMsg").textContent = "دوس عليه للنسخ";
    }, 1800);
  });

  againBtn.addEventListener("click", () => {
    card3d.classList.remove("flipped");
    longUrlInput.value = "";
    errorMsg.textContent = "";
  });

  // ====== Redirect handling ======
  // If the URL path is something like site.com/abc123, look it up and redirect.
  (async function handleRoute() {
    const path = location.pathname.replace(/^\/+/, "");
    if (!path || path === "index.html") return; // normal homepage, show the form

    document.getElementById("mainApp").classList.add("hidden");
    const screen = document.getElementById("redirectScreen");
    screen.classList.remove("hidden");

    const row = await lookupShortLink(path);
    if (row && row.original_url) {
      bumpClicks(row.id, row.clicks);
      location.replace(row.original_url);
    } else {
      document.getElementById("redirectText").textContent = "الرابط ده مش موجود 😕";
      const drop = document.querySelector(".drop");
      drop.style.animation = "none";
      drop.style.opacity = "0.4";
    }
  })();
</script>
</body>
</html>
