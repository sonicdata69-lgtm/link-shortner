<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>zlink | اختصار الروابط</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="blobs">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
</div>
<div class="ripple-overlay"></div>

<!-- شاشة التحويل + الإعلان (بتظهر لما حد يفتح رابط مختصر) -->
<div id="redirectScreen" class="redirect-screen hidden">
  <div id="adSlot" style="max-width:100%;"></div>
  <div class="drop hidden" id="dropIcon"></div>
  <div id="redirectText" data-i18n="redirect_text">بنوصلك للرابط...</div>
  <button class="btn btn-ghost hidden" id="skipBtn" style="min-width:160px;"></button>

  <div id="passwordBox" class="card hidden" style="max-width:380px; text-align:start;">
    <h2 data-i18n="protected_link_title">الرابط ده محمي بباسورد</h2>
    <label data-i18n="enter_password_label">اكتب الباسورد للمتابعة</label>
    <input type="password" id="linkPasswordInput" class="url-input" />
    <div class="error-msg" id="passwordErr"></div>
    <button class="btn" id="unlockBtn"><span data-i18n="unlock_btn">دخول</span></button>
  </div>
</div>

<div id="mainApp">
  <nav class="topnav">
    <a href="index.html" class="logo">zlink</a>
    <div class="nav-links">
      <a href="dashboard.html" id="navDashboard" class="hidden" data-i18n="nav_dashboard">لوحتي</a>
      <a href="admin.html" id="navAdmin" class="hidden" data-i18n="nav_admin">الأدمن</a>
      <a href="auth.html" id="navLogin" data-i18n="nav_login">دخول</a>
      <button id="navLogout" class="hidden" data-i18n="nav_logout">خروج</button>
      <div class="lang-switch">
        <button class="lang-btn" data-lang="ar">AR</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
    </div>
  </nav>

  <div class="page">
    <div class="wrap">
      <div class="brand">
        <div class="logo-eyebrow">ZLINK</div>
        <h1>zlink</h1>
        <p data-i18n="brand_tagline">اختصر رابطك واربح من كل كليك</p>
      </div>

      <div class="stage">
        <div class="card3d" id="card3d">
          <div class="face face-front">
            <label for="longUrl" data-i18n="url_label">الرابط الطويل</label>
            <input type="text" id="longUrl" class="url-input" data-i18n-placeholder="url_placeholder" placeholder="https://example.com/very/long/link" />
            <div class="error-msg" id="errorMsg"></div>
            <button class="btn" id="shortenBtn">
              <span class="shine"></span>
              <span data-i18n="shorten_btn">اختصر الرابط</span>
            </button>
            <div class="success-badge" id="loginHint" data-i18n="login_hint">سجّل دخولك عشان تربح فلوس من روابطك</div>
          </div>

          <div class="face face-back">
            <label data-i18n="result_label">رابطك الجديد جاهز</label>
            <div class="result-url" id="resultUrl">—</div>
            <div class="success-badge" id="copiedMsg" data-i18n="copy_hint">دوس عليه للنسخ</div>
            <button class="btn btn-ghost" id="againBtn" data-i18n="again_btn">اختصار رابط تاني</button>
          </div>
        </div>
      </div>

      <footer data-i18n="footer_text">zlink — اختصار روابط واربح</footer>
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script>
function randomCode(len = 6) {
  const chars = "abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let out = "";
  for (let i = 0; i < len; i++) out += chars[Math.floor(Math.random() * chars.length)];
  return out;
}

function normalizeUrl(v) {
  v = v.trim();
  if (!v) return null;
  if (!/^https?:\/\//i.test(v)) v = "https://" + v;
  try { new URL(v); return v; } catch (e) { return null; }
}

async function createShortLink(originalUrl) {
  const { data: { user } } = await sb.auth.getUser();
  for (let attempt = 0; attempt < 5; attempt++) {
    const code = randomCode(6);
    const { error } = await sb.from("links").insert({
      short_code: code,
      original_url: originalUrl,
      owner_id: user ? user.id : null
    });
    if (!error) return code;
    if (error.code !== "23505") throw error; // 23505 = unique_violation, try again
  }
  throw new Error("تعذر إنشاء رابط فريد");
}

const RESERVED_PATHS = ["", "index.html", "auth.html", "dashboard.html", "admin.html"];

function showNotFound(expired) {
  document.getElementById("redirectText").textContent = expired ? t("link_expired") : t("link_not_found");
}

async function proceedWithAd(target) {
  document.getElementById("dropIcon").classList.remove("hidden");
  const { data: settings } = await sb.from("settings").select("ad_html, ad_seconds").eq("id", 1).single();
  const adSeconds = (settings && settings.ad_seconds) || 0;
  const adHtml = (settings && settings.ad_html) || "";

  if (adHtml) document.getElementById("adSlot").innerHTML = adHtml;

  if (adSeconds > 0) {
    const skipBtn = document.getElementById("skipBtn");
    let remaining = adSeconds;
    skipBtn.classList.remove("hidden");
    skipBtn.disabled = true;
    const tick = () => {
      skipBtn.textContent = `${t("skip_ad_wait")} (${remaining})`;
      if (remaining <= 0) {
        skipBtn.textContent = t("skip_ad");
        skipBtn.disabled = false;
        clearInterval(timer);
      }
      remaining--;
    };
    tick();
    const timer = setInterval(tick, 1000);
    skipBtn.addEventListener("click", () => { if (!skipBtn.disabled) location.replace(target); });
  } else {
    location.replace(target);
  }
}

async function handleRoute() {
  const path = location.pathname.replace(/^\/+/, "");
  if (RESERVED_PATHS.includes(path)) return; // homepage, show the form

  document.getElementById("mainApp").classList.add("hidden");
  document.getElementById("redirectScreen").classList.remove("hidden");
  document.getElementById("redirectText").textContent = "";

  const { data, error } = await sb.rpc("get_link_info", { p_short_code: path });

  if (error || !data || !data.found) {
    showNotFound(data && data.expired);
    return;
  }

  if (data.needs_password) {
    document.getElementById("passwordBox").classList.remove("hidden");
    document.getElementById("unlockBtn").addEventListener("click", async () => {
      const pass = document.getElementById("linkPasswordInput").value;
      const { data: unlocked, error: uErr } = await sb.rpc("unlock_link", { p_link_id: data.id, p_password: pass });
      if (uErr || !unlocked || !unlocked.ok) {
        document.getElementById("passwordErr").textContent = t("wrong_password");
        return;
      }
      document.getElementById("passwordBox").classList.add("hidden");
      proceedWithAd(unlocked.original_url);
    });
    return;
  }

  const { data: unlocked, error: uErr } = await sb.rpc("unlock_link", { p_link_id: data.id });
  if (uErr || !unlocked || !unlocked.ok) {
    showNotFound(unlocked && unlocked.error === "expired");
    return;
  }
  proceedWithAd(unlocked.original_url);
}

(async function init() {
  initLangSwitcher();
  const profile = await updateNav();
  document.getElementById("loginHint").classList.toggle("hidden", !!profile);
  handleRoute();
})();

const card3d = document.getElementById("card3d");
const longUrlInput = document.getElementById("longUrl");
const shortenBtn = document.getElementById("shortenBtn");
const errorMsg = document.getElementById("errorMsg");
const resultUrl = document.getElementById("resultUrl");
const againBtn = document.getElementById("againBtn");

shortenBtn.addEventListener("click", async () => {
  errorMsg.textContent = "";
  const normalized = normalizeUrl(longUrlInput.value);
  if (!normalized) {
    errorMsg.textContent = t("url_error");
    return;
  }
  shortenBtn.disabled = true;
  const label = shortenBtn.querySelector("span:last-child");
  label.textContent = t("shorten_loading");
  try {
    const code = await createShortLink(normalized);
    const fullShort = `${location.origin}/${code}`;
    resultUrl.textContent = fullShort;
    resultUrl.dataset.link = fullShort;
    card3d.classList.add("flipped");
  } catch (e) {
    errorMsg.textContent = t("generic_error");
    console.error(e);
  } finally {
    shortenBtn.disabled = false;
    label.textContent = t("shorten_btn");
  }
});

resultUrl.addEventListener("click", () => {
  const link = resultUrl.dataset.link;
  if (!link) return;
  navigator.clipboard?.writeText(link);
  document.getElementById("copiedMsg").textContent = t("copied");
  setTimeout(() => { document.getElementById("copiedMsg").textContent = t("copy_hint"); }, 1800);
});

againBtn.addEventListener("click", () => {
  card3d.classList.remove("flipped");
  longUrlInput.value = "";
  errorMsg.textContent = "";
});
</script>
</body>
</html>
