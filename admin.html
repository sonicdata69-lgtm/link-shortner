</head>
<body>

  <div class="blob blob1"></div>
  <div class="blob blob2"></div>

<div class="ripple-overlay"></div>

<nav class="topnav">
  <a href="index.html" class="logo">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07l-1.5 1.5"></path><path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07l1.5-1.5"></path></svg>
    <span>zlink</span>
  </a>
  <div class="nav-links">
    <a href="dashboard.html" id="navDashboard" class="hidden">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg>
      <span data-i18n="nav_dashboard">لوحتي</span>
    </a>
    <a href="admin.html" id="navAdmin" class="hidden">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 8.7 8 11 4.6-2.3 8-6 8-11V5l-8-3z"></path></svg>
      <span data-i18n="nav_admin">الأدمن</span>
    </a>
    <a href="auth.html" id="navLogin">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
      <span data-i18n="nav_login">دخول</span>
    </a>
    <button id="navLogout" class="hidden">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
      <span data-i18n="nav_logout">خروج</span>
    </button>
    <div class="lang-switch">
      <button class="lang-btn" data-lang="ar">AR</button>

    </div>

</nav>

<div class="page hidden" id="noAccess">
  <div class="card" style="max-width:480px;">
    <h2 data-i18n="admin_no_access">الصفحة دي للأدمن بس</h2>
  </div>
</div>

<div class="page hidden" id="adminApp">
  <h1 style="font-family:'Space Grotesk',sans-serif; display:flex; align-items:center; gap:10px;">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:26px;height:26px;color:var(--cyan);"><path d="M12 2 4 5v6c0 5 3.4 8.7 8 11 4.6-2.3 8-6 8-11V5l-8-3z"></path></svg>
    <span data-i18n="admin_title">لوحة تحكم الأدمن</span>
  </h1>

  <div class="tabs">
    <button class="tab-btn active" data-tab="withdrawals">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"></rect><path d="M2 10h20"></path></svg>
      <span data-i18n="tab_withdrawals">طلبات السحب</span>
    </button>
    <button class="tab-btn" data-tab="users">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
      <span data-i18n="tab_users">المستخدمين</span>
    </button>
    <button class="tab-btn" data-tab="settings">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      <span data-i18n="tab_settings">الإعدادات</span>
    </button>
  </div>

  <div class="card tab-panel" id="panel-withdrawals">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-i18n="wd_col_email">الإيميل</th>
            <th data-i18n="wd_col_amount">المبلغ</th>
            <th data-i18n="wd_col_method">الطريقة</th>
            <th data-i18n="wd_col_details">البيانات</th>
            <th data-i18n="wd_col_status">الحالة</th>
            <th data-i18n="wd_col_actions">إجراء</th>
          </tr>
        </thead>
        <tbody id="withdrawalsBody"></tbody>
      </table>
    </div>
  </div>

  <div class="card tab-panel hidden" id="panel-users">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-i18n="users_col_email">الإيميل</th>
            <th data-i18n="users_col_balance">الرصيد</th>
            <th data-i18n="users_col_joined">تاريخ التسجيل</th>
          </tr>
        </thead>
        <tbody id="usersBody"></tbody>
      </table>
    </div>
  </div>

  <div class="card tab-panel hidden" id="panel-settings" style="max-width:600px;">
    <label for="siteName" data-i18n="settings_site_name">اسم الموقع</label>
    <input type="text" id="siteName" class="url-input" />
    <label for="rate" data-i18n="settings_rate">الأرباح لكل 1000 كليك (جنيه)</label>
    <input type="number" id="rate" class="url-input" step="0.01" />
    <label for="minWithdraw" data-i18n="settings_min_withdraw">أقل مبلغ للسحب</label>
    <input type="number" id="minWithdraw" class="url-input" step="0.01" />
    <label for="adSeconds" data-i18n="settings_ad_seconds">ثواني الانتظار قبل التخطي</label>
    <input type="number" id="adSeconds" class="url-input" />
    <label for="adHtml" data-i18n="settings_ad_html">كود الإعلان (HTML/JS)</label>
    <textarea id="adHtml" rows="6" placeholder="<script>...</script>"></textarea>
    <div class="success-msg" id="settingsSaved"></div>
    <button class="btn" id="saveSettingsBtn">
      <span class="shine"></span>
      <span data-i18n="save_settings">حفظ الإعدادات</span>
    </button>
  </div>
</div>

<script src="shared.js"></script>
<script>
function statusBadge(status) {
  const cls = { pending: "badge-pending", approved: "badge-approved", rejected: "badge-rejected", paid: "badge-paid" }[status] || "";
  return `<span class="badge ${cls}">${t("status_" + status)}</span>`;
}
function methodLabel(m) {
  return METHOD_LABELS[getLang()][m] || m;
}

async function loadWithdrawals() {
  const { data, error } = await sb.rpc("admin_list_withdrawals");
  const body = document.getElementById("withdrawalsBody");
  body.innerHTML = "";
  if (error) return;
  (data || []).forEach(row => {
    const tr = document.createElement("tr");
    const actions = row.status === "pending"
      ? `<button class="btn btn-small" data-act="approved" data-id="${row.id}">${t("approve")}</button>
         <button class="btn btn-small btn-danger" data-act="rejected" data-id="${row.id}">${t("reject")}</button>`
      : row.status === "approved"
      ? `<button class="btn btn-small" data-act="paid" data-id="${row.id}">${t("mark_paid")}</button>`
      : "—";
    tr.innerHTML = `<td>${row.email}</td><td>${row.amount} ${t("egp")}</td><td>${methodLabel(row.method)}</td><td style="direction:ltr;">${row.account_details}</td><td>${statusBadge(row.status)}</td><td>${actions}</td>`;
    body.appendChild(tr);
  });
  body.querySelectorAll("button[data-act]").forEach(btn => {
    btn.addEventListener("click", async () => {
      await sb.rpc("admin_update_withdrawal", { p_id: parseInt(btn.dataset.id), p_status: btn.dataset.act });
      loadWithdrawals();
    });
  });
}

async function loadUsers() {
  const { data, error } = await sb.rpc("admin_list_users");
  const body = document.getElementById("usersBody");
  body.innerHTML = "";
  if (error) return;
  (data || []).forEach(row => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${row.email}</td><td>${(row.balance || 0).toFixed(2)} ${t("egp")}</td><td>${new Date(row.created_at).toLocaleDateString()}</td>`;
    body.appendChild(tr);
  });
}

async function loadSettings() {
  const { data } = await sb.from("settings").select("*").eq("id", 1).single();
  if (!data) return;
  document.getElementById("siteName").value = data.site_name;
  document.getElementById("rate").value = data.rate_per_1000;
  document.getElementById("minWithdraw").value = data.min_withdrawal;
  document.getElementById("adSeconds").value = data.ad_seconds;
  document.getElementById("adHtml").value = data.ad_html;
}

document.getElementById("saveSettingsBtn").addEventListener("click", async () => {
  const { error } = await sb.rpc("admin_update_settings", {
    p_site_name: document.getElementById("siteName").value,
    p_rate_per_1000: parseFloat(document.getElementById("rate").value) || 0,
    p_min_withdrawal: parseFloat(document.getElementById("minWithdraw").value) || 0,
    p_ad_html: document.getElementById("adHtml").value,
    p_ad_seconds: parseInt(document.getElementById("adSeconds").value) || 0
  });
  document.getElementById("settingsSaved").textContent = error ? t("generic_error") : t("settings_saved");
});

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.add("hidden"));
    btn.classList.add("active");
    document.getElementById("panel-" + btn.dataset.tab).classList.remove("hidden");
  });
});

(async function init() {
  initLangSwitcher();
  const profile = await updateNav();
  if (!profile || !profile.is_admin) {
    document.getElementById("noAccess").classList.remove("hidden");
    return;
  }
  document.getElementById("adminApp").classList.remove("hidden");
  loadWithdrawals();
  loadUsers();
  loadSettings();
})();
</script>
</body>
</html>
