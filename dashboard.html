<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>zlink | لوحتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>

<div class="blobs">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
</div>
<div class="ripple-overlay"></div>

<nav class="topnav">
  <a href="index.html" class="logo">zlink</a>
  <div class="nav-links">
    <a href="dashboard.html" id="navDashboard" class="hidden" data-i18n="nav_dashboard">لوحتي</a>
    <a href="admin.html" id="navAdmin" class="hidden" data-i18n="nav_admin">الأدمن</a>
    <a href="auth.html" id="navLogin" data-i18n="nav_login">دخول</a>
    <button id="navLogout" class="hidden" data-i18n="nav_logout">خروج</button>
    <div class="lang-switch">
      <button class="lang-btn" data-lang="ar">AR</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>
  </div>
</nav>

<div class="page">
  <h1 style="font-family:'Space Grotesk',sans-serif;" data-i18n="dash_title">لوحة التحكم</h1>

  <div class="stat-row" style="margin-bottom:20px;">
    <div class="stat-box">
      <div class="num" id="balanceNum">0</div>
      <div class="lbl" data-i18n="balance_label">رصيدك الحالي</div>
    </div>
  </div>

  <div class="card" style="max-width:560px;">
    <h2 data-i18n="shorten_btn">اختصر الرابط</h2>
    <label for="longUrl" data-i18n="url_label">الرابط الطويل</label>
    <input type="text" id="longUrl" class="url-input" data-i18n-placeholder="url_placeholder" placeholder="https://example.com/very/long/link" />

    <button type="button" class="btn-ghost btn-small" id="advToggle" style="align-self:flex-start;" data-i18n="advanced_options">خيارات متقدمة (اختياري)</button>

    <div id="advBox" class="hidden" style="display:flex; flex-direction:column; gap:14px;">
      <div>
        <label for="customAlias" data-i18n="custom_alias_label">اسم مخصص للرابط (اختياري)</label>
        <input type="text" id="customAlias" class="url-input" data-i18n-placeholder="custom_alias_placeholder" placeholder="my-link" />
      </div>
      <div>
        <label for="linkPassword" data-i18n="password_protect_label">حماية بباسورد (اختياري)</label>
        <input type="password" id="linkPassword" class="url-input" data-i18n-placeholder="password_protect_placeholder" />
      </div>
      <div>
        <label for="expirySelect" data-i18n="expiry_label">تاريخ الانتهاء</label>
        <select id="expirySelect">
          <option value="" data-i18n="expiry_none">بدون</option>
          <option value="1" data-i18n="expiry_1d">يوم واحد</option>
          <option value="7" data-i18n="expiry_7d">7 أيام</option>
          <option value="30" data-i18n="expiry_30d">30 يوم</option>
        </select>
      </div>
    </div>

    <div class="error-msg" id="shortenErr"></div>
    <div class="result-url hidden" id="shortenResult"></div>
    <button class="btn" id="shortenBtn">
      <span class="shine"></span>
      <span data-i18n="shorten_btn">اختصر الرابط</span>
    </button>
  </div>

  <div class="card">
    <h2 data-i18n="my_links">روابطي</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-i18n="link_col_short">الرابط المختصر</th>
            <th data-i18n="link_col_dest">الوجهة</th>
            <th data-i18n="link_col_clicks">الكليكات</th>
            <th data-i18n="link_col_actions">إجراءات</th>
          </tr>
        </thead>
        <tbody id="linksBody"></tbody>
      </table>
      <div id="noLinks" class="success-badge hidden" data-i18n="no_links">لسه معملتش أي رابط</div>
    </div>
  </div>

  <!-- QR modal -->
  <div class="page hidden" id="qrModal" style="position:fixed; inset:0; z-index:20; background:rgba(4,20,28,0.85); display:flex; align-items:center; justify-content:center;">
    <div class="card" style="max-width:320px; text-align:center; align-items:center;">
      <h2 data-i18n="qr_title">كود QR للرابط</h2>
      <img id="qrImage" src="" alt="QR" style="width:220px;height:220px;border-radius:12px;background:#fff;padding:8px;" />
      <button class="btn btn-ghost" id="qrCloseBtn" data-i18n="close_btn">إغلاق</button>
    </div>
  </div>

  <!-- Edit modal -->
  <div class="page hidden" id="editModal" style="position:fixed; inset:0; z-index:20; background:rgba(4,20,28,0.85); display:flex; align-items:center; justify-content:center;">
    <div class="card" style="max-width:420px;">
      <h2 data-i18n="edit_link_title">تعديل الرابط</h2>
      <label data-i18n="new_destination_label">الرابط الأصلي الجديد</label>
      <input type="text" id="editDest" class="url-input" />
      <label data-i18n="new_password_label">باسورد جديد (سيبه فاضي عشان تشيله)</label>
      <input type="password" id="editPassword" class="url-input" />
      <label data-i18n="expiry_label">تاريخ الانتهاء</label>
      <select id="editExpiry">
        <option value="" data-i18n="expiry_none">بدون</option>
        <option value="1" data-i18n="expiry_1d">يوم واحد</option>
        <option value="7" data-i18n="expiry_7d">7 أيام</option>
        <option value="30" data-i18n="expiry_30d">30 يوم</option>
      </select>
      <div class="error-msg" id="editErr"></div>
      <div style="display:flex; gap:10px;">
        <button class="btn" id="editSaveBtn" data-i18n="save_btn">حفظ</button>
        <button class="btn btn-ghost" id="editCancelBtn" data-i18n="cancel_btn">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- Stats modal -->
  <div class="page hidden" id="statsModal" style="position:fixed; inset:0; z-index:20; background:rgba(4,20,28,0.85); display:flex; align-items:center; justify-content:center;">
    <div class="card" style="max-width:480px; width:90%;">
      <h2 data-i18n="stats_title">إحصائيات الكليكات</h2>
      <canvas id="statsChart" height="200"></canvas>
      <div id="noStats" class="success-badge hidden" data-i18n="no_stats">لسه مفيش كليكات على الرابط ده</div>
      <button class="btn btn-ghost" id="statsCloseBtn" data-i18n="close_btn">إغلاق</button>
    </div>
  </div>

  <div class="card" style="max-width:480px;">
    <h2 data-i18n="withdraw_title">طلب سحب أرباح</h2>
    <label for="amount" data-i18n="amount_label">المبلغ</label>
    <input type="number" id="amount" class="url-input" placeholder="0" />
    <label for="method" data-i18n="method_label">طريقة السحب</label>
    <select id="method">
      <option value="vodafone_cash">فودافون كاش</option>
      <option value="instapay">إنستاباي</option>
      <option value="binance">باينانس</option>
    </select>
    <label for="details" data-i18n="details_label">بيانات الحساب (رقم / يوزر / عنوان محفظة)</label>
    <input type="text" id="details" class="url-input" placeholder="" />
    <div class="error-msg" id="wErrorMsg"></div>
    <div class="success-msg" id="wSuccessMsg"></div>
    <button class="btn" id="withdrawBtn">
      <span class="shine"></span>
      <span data-i18n="withdraw_btn">اطلب السحب</span>
    </button>
  </div>

  <div class="card">
    <h2 data-i18n="withdraw_history">طلباتي السابقة</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-i18n="wd_col_amount">المبلغ</th>
            <th data-i18n="wd_col_method">الطريقة</th>
            <th data-i18n="wd_col_status">الحالة</th>
          </tr>
        </thead>
        <tbody id="withdrawalsBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script>
let currentProfile = null;
let currentEditId = null;
let statsChartInstance = null;

function statusBadge(status) {
  const cls = { pending: "badge-pending", approved: "badge-approved", rejected: "badge-rejected", paid: "badge-paid" }[status] || "";
  return `<span class="badge ${cls}">${t("status_" + status)}</span>`;
}
function methodLabel(m) {
  return METHOD_LABELS[getLang()][m] || m;
}

function normalizeUrl(v) {
  v = (v || "").trim();
  if (!v) return null;
  if (!/^https?:\/\//i.test(v)) v = "https://" + v;
  try { new URL(v); return v; } catch (e) { return null; }
}

function randomCode(len = 6) {
  const chars = "abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let out = "";
  for (let i = 0; i < len; i++) out += chars[Math.floor(Math.random() * chars.length)];
  return out;
}

function expiryDaysToDate(days) {
  if (!days) return null;
  const d = new Date();
  d.setDate(d.getDate() + parseInt(days));
  return d.toISOString();
}

async function loadLinks(userId) {
  const { data } = await sb.from("links").select("id, short_code, original_url, clicks, password_hash, expires_at").eq("owner_id", userId).order("created_at", { ascending: false });
  const body = document.getElementById("linksBody");
  body.innerHTML = "";
  document.getElementById("noLinks").classList.toggle("hidden", !!(data && data.length));
  (data || []).forEach(row => {
    const tr = document.createElement("tr");
    const shortUrl = `${location.origin}/${row.short_code}`;
    const destShort = row.original_url.length > 30 ? row.original_url.slice(0, 30) + "…" : row.original_url;
    const lock = row.password_hash ? " 🔒" : "";
    tr.innerHTML = `
      <td style="direction:ltr;text-align:right;color:var(--cyan);">${shortUrl}${lock}</td>
      <td style="max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; direction:ltr; text-align:right;">${destShort}</td>
      <td>${row.clicks}</td>
      <td style="white-space:nowrap;">
        <button class="btn btn-small btn-ghost" data-act="copy" data-url="${shortUrl}">${t("copy_btn")}</button>
        <button class="btn btn-small btn-ghost" data-act="qr" data-url="${shortUrl}">${t("qr_btn")}</button>
        <button class="btn btn-small btn-ghost" data-act="stats" data-id="${row.id}">${t("stats_btn")}</button>
        <button class="btn btn-small btn-ghost" data-act="edit" data-id="${row.id}" data-dest="${row.original_url}" data-expires="${row.expires_at || ""}">${t("edit_btn")}</button>
        <button class="btn btn-small btn-danger" data-act="delete" data-id="${row.id}">${t("delete_btn")}</button>
      </td>`;
    body.appendChild(tr);
  });
  wireLinkActions();
}

function wireLinkActions() {
  document.querySelectorAll("#linksBody button[data-act]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const act = btn.dataset.act;
      if (act === "copy") {
        navigator.clipboard?.writeText(btn.dataset.url);
        btn.textContent = t("copied");
        setTimeout(() => btn.textContent = t("copy_btn"), 1500);
      } else if (act === "qr") {
        const qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" + encodeURIComponent(btn.dataset.url);
        document.getElementById("qrImage").src = qrUrl;
        document.getElementById("qrModal").classList.remove("hidden");
      } else if (act === "delete") {
        if (!confirm(t("delete_confirm"))) return;
        await sb.from("links").delete().eq("id", btn.dataset.id);
        refreshAll();
      } else if (act === "edit") {
        currentEditId = btn.dataset.id;
        document.getElementById("editDest").value = btn.dataset.dest;
        document.getElementById("editPassword").value = "";
        document.getElementById("editExpiry").value = "";
        document.getElementById("editErr").textContent = "";
        document.getElementById("editModal").classList.remove("hidden");
      } else if (act === "stats") {
        openStats(btn.dataset.id);
      }
    });
  });
}

async function openStats(linkId) {
  document.getElementById("statsModal").classList.remove("hidden");
  const { data, error } = await sb.rpc("get_link_stats", { p_link_id: parseInt(linkId) });
  const canvas = document.getElementById("statsChart");
  const noStats = document.getElementById("noStats");
  if (statsChartInstance) { statsChartInstance.destroy(); statsChartInstance = null; }
  if (error || !data || !data.length) {
    canvas.classList.add("hidden");
    noStats.classList.remove("hidden");
    return;
  }
  canvas.classList.remove("hidden");
  noStats.classList.add("hidden");
  statsChartInstance = new Chart(canvas, {
    type: "line",
    data: {
      labels: data.map(r => r.day),
      datasets: [{
        label: t("link_col_clicks"),
        data: data.map(r => r.cnt),
        borderColor: "#39e5d1",
        backgroundColor: "rgba(57,229,209,0.15)",
        tension: 0.3,
        fill: true
      }]
    },
    options: {
      scales: {
        x: { ticks: { color: "#eafdfb" }, grid: { color: "rgba(234,253,251,0.1)" } },
        y: { ticks: { color: "#eafdfb" }, grid: { color: "rgba(234,253,251,0.1)" }, beginAtZero: true }
      },
      plugins: { legend: { labels: { color: "#eafdfb" } } }
    }
  });
}

document.getElementById("qrCloseBtn").addEventListener("click", () => document.getElementById("qrModal").classList.add("hidden"));
document.getElementById("statsCloseBtn").addEventListener("click", () => document.getElementById("statsModal").classList.add("hidden"));
document.getElementById("editCancelBtn").addEventListener("click", () => document.getElementById("editModal").classList.add("hidden"));

document.getElementById("editSaveBtn").addEventListener("click", async () => {
  const errEl = document.getElementById("editErr");
  errEl.textContent = "";
  const dest = normalizeUrl(document.getElementById("editDest").value);
  if (!dest) { errEl.textContent = t("url_error"); return; }
  const newPassword = document.getElementById("editPassword").value;
  const expiryDays = document.getElementById("editExpiry").value;

  const { error: uErr } = await sb.from("links").update({
    original_url: dest,
    expires_at: expiryDaysToDate(expiryDays)
  }).eq("id", currentEditId);

  if (uErr) { errEl.textContent = t("generic_error"); return; }

  await sb.rpc("set_link_password", { p_link_id: parseInt(currentEditId), p_password: newPassword || null });

  document.getElementById("editModal").classList.add("hidden");
  refreshAll();
});

document.getElementById("advToggle").addEventListener("click", () => {
  document.getElementById("advBox").classList.toggle("hidden");
});

document.getElementById("shortenBtn").addEventListener("click", async () => {
  const errEl = document.getElementById("shortenErr");
  const resultEl = document.getElementById("shortenResult");
  errEl.textContent = "";
  resultEl.classList.add("hidden");

  const normalized = normalizeUrl(document.getElementById("longUrl").value);
  if (!normalized) { errEl.textContent = t("url_error"); return; }

  const alias = document.getElementById("customAlias").value.trim();
  const password = document.getElementById("linkPassword").value;
  const expiryDays = document.getElementById("expirySelect").value;

  const { data: { user } } = await sb.auth.getUser();
  let code = alias || randomCode(6);

  const { data: inserted, error } = await sb.from("links").insert({
    short_code: code,
    original_url: normalized,
    owner_id: user ? user.id : null,
    expires_at: expiryDaysToDate(expiryDays)
  }).select().single();

  if (error) {
    errEl.textContent = error.code === "23505" ? t("alias_taken") : t("generic_error");
    return;
  }

  if (password) {
    await sb.rpc("set_link_password", { p_link_id: inserted.id, p_password: password });
  }

  const fullShort = `${location.origin}/${code}`;
  resultEl.textContent = fullShort;
  resultEl.dataset.link = fullShort;
  resultEl.classList.remove("hidden");
  document.getElementById("longUrl").value = "";
  document.getElementById("customAlias").value = "";
  document.getElementById("linkPassword").value = "";
  document.getElementById("expirySelect").value = "";
  refreshAll();
});

document.getElementById("shortenResult").addEventListener("click", function () {
  const link = this.dataset.link;
  if (!link) return;
  navigator.clipboard?.writeText(link);
  const old = this.textContent;
  this.textContent = t("copied");
  setTimeout(() => { this.textContent = old; }, 1500);
});

async function loadWithdrawals(userId) {
  const { data } = await sb.from("withdrawals").select("*").eq("user_id", userId).order("created_at", { ascending: false });
  const body = document.getElementById("withdrawalsBody");
  body.innerHTML = "";
  (data || []).forEach(row => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${row.amount} ${t("egp")}</td><td>${methodLabel(row.method)}</td><td>${statusBadge(row.status)}</td>`;
    body.appendChild(tr);
  });
}

async function refreshAll() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) { location.href = "auth.html"; return; }
  currentProfile = await getCurrentProfile();
  document.getElementById("balanceNum").textContent = `${(currentProfile.balance || 0).toFixed(2)} ${t("egp")}`;
  loadLinks(user.id);
  loadWithdrawals(user.id);
}

document.getElementById("withdrawBtn").addEventListener("click", async () => {
  const wErr = document.getElementById("wErrorMsg");
  const wOk = document.getElementById("wSuccessMsg");
  wErr.textContent = ""; wOk.textContent = "";
  const amount = parseFloat(document.getElementById("amount").value);
  const method = document.getElementById("method").value;
  const details = document.getElementById("details").value.trim();

  if (!amount || amount <= 0 || !details) {
    wErr.textContent = t("url_error");
    return;
  }
  const { data, error } = await sb.rpc("request_withdrawal", {
    p_amount: amount, p_method: method, p_details: details
  });
  if (error || !data || !data.ok) {
    wErr.textContent = t("generic_error");
    return;
  }
  wOk.textContent = t("withdraw_success");
  document.getElementById("amount").value = "";
  document.getElementById("details").value = "";
  refreshAll();
});

(async function init() {
  initLangSwitcher();
  await updateNav();
  refreshAll();
})();
</script>
</body>
</html>
