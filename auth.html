<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>zlink | دخول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="blobs">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
</div>
<div class="ripple-overlay"></div>

<nav class="topnav">
  <a href="index.html" class="logo">zlink</a>
  <div class="nav-links">
    <a href="dashboard.html" id="navDashboard" class="hidden" data-i18n="nav_dashboard">لوحتي</a>
    <a href="admin.html" id="navAdmin" class="hidden" data-i18n="nav_admin">الأدمن</a>
    <a href="auth.html" id="navLogin" data-i18n="nav_login">دخول</a>
    <button id="navLogout" class="hidden" data-i18n="nav_logout">خروج</button>
    <div class="lang-switch">
      <button class="lang-btn" data-lang="ar">AR</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>
  </div>
</nav>

<div class="page">
  <div class="wrap">
    <div class="card">
      <h2 data-i18n="auth_title">دخول / حساب جديد</h2>
      <label for="email" data-i18n="email_label">البريد الإلكتروني</label>
      <input type="email" id="email" class="url-input" placeholder="you@example.com" />
      <label for="password" data-i18n="password_label">كلمة المرور</label>
      <input type="password" id="password" class="url-input" placeholder="••••••••" />
      <div class="error-msg" id="errorMsg"></div>
      <button class="btn" id="loginBtn">
        <span class="shine"></span>
        <span data-i18n="login_btn">دخول</span>
      </button>
      <button class="btn btn-ghost" id="signupBtn" data-i18n="signup_btn">إنشاء حساب</button>
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script>
initLangSwitcher();
updateNav();

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const errorMsg = document.getElementById("errorMsg");

document.getElementById("loginBtn").addEventListener("click", async () => {
  errorMsg.textContent = "";
  const { error } = await sb.auth.signInWithPassword({
    email: emailInput.value.trim(),
    password: passwordInput.value
  });
  if (error) { errorMsg.textContent = t("auth_error"); return; }
  location.href = "dashboard.html";
});

document.getElementById("signupBtn").addEventListener("click", async () => {
  errorMsg.textContent = "";
  const { error } = await sb.auth.signUp({
    email: emailInput.value.trim(),
    password: passwordInput.value
  });
  if (error) { errorMsg.textContent = t("auth_error"); return; }
  location.href = "dashboard.html";
});
</script>
</body>
</html>
